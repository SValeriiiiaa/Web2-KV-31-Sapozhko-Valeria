<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsPass | Словник </title>
    
    <link rel="icon" type="image/png" href="bg.png">    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* основні налаштування кольорів та тіней */
        :root {
            --brand-gradient: linear-gradient(135deg, #FF5F6D 0%, #FFC371 100%);
            --soft-bg: #f8f9fa;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'verdana', sans-serif; 
            background-color: var(--soft-bg); 
            color: #2d3436; 
        }

        /* бокова панель */
        .sidebar { 
            background: #1a1a1a; 
            min-height: 100vh; 
            width: 260px; 
            border-radius: 0 30px 30px 0; 
            position: fixed; 
            z-index: 1000;
        }

        .sidebar-logo {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 15px rgba(255, 95, 109, 0.2));
        }

        .sidebar-brand-text { 
            font-size: 1.5rem; 
            background: var(--brand-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 800; 
            display: block;
        }

        .nav-link { 
            color: #a0a0a0 !important; 
            padding: 12px 25px !important; 
            margin: 8px 15px; 
            border-radius: 12px; 
            transition: 0.3s;
        }
        .nav-link:hover, .nav-link.active { 
            background: rgba(255, 255, 255, 0.05); 
            color: #fff !important; 
        }
        .nav-link i { margin-right: 10px; width: 20px; text-align: center; }

        /* основна робоча область */
        .content-area { 
            margin-left: 260px; 
            padding: 40px; 
            width: calc(100% - 260px); 
        }

        /* кнопки у верхній панелі */
        .header-action-btn {
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: white; color: #636e72; text-decoration: none;
            box-shadow: var(--card-shadow); margin-right: 15px; transition: all 0.3s; position: relative;
        }
        .header-action-btn:hover { color: #FF5F6D; transform: translateY(-2px); }
        
        .notification-badge {
            position: absolute; top: 12px; right: 14px; width: 8px; height: 8px;
            background: #FF5F6D; border-radius: 50%; border: 2px solid white;
        }

        /* картки слів  */
        .word-card {
            background: white; border: none; border-radius: 20px; padding: 24px;
            box-shadow: var(--card-shadow); transition: all 0.3s ease; height: 100%;
            border-bottom: 4px solid transparent; position: relative; 
        }
        .word-card:hover { transform: translateY(-5px); border-bottom-color: #FFC371; }

        .word-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-right: 34px;
        }
        .learned-check {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #636e72;
            cursor: pointer;
            margin: 0;
        }
        .learned-check input {
            width: 18px;
            height: 18px;
            accent-color: #FF5F6D;
            cursor: pointer;
        }
        .delete-word-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 10px;
            background: #fff0f0;
            color: #d63031;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .delete-word-btn:hover {
            background: #d63031;
            color: white;
            transform: translateY(-2px);
        }
        .word-card.word-learned {
            opacity: 0.72;
            border-bottom-color: #2ecc71;
        }
        .word-card.word-learned h4,
        .word-card.word-learned h5 {
            text-decoration: line-through;
        }

        .audio-icon { position: absolute; top: 20px; right: 20px; color: #ced4da; cursor: pointer; transition: 0.3s; }
        .audio-icon:hover { color: #FFC371; }
        
        /* кольорові теги для частин мови */
        .tag { font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        .tag-verb { background: #e3f2fd; color: #1976d2; }
        .tag-noun { background: #f3e5f5; color: #7b1fa2; }
        .tag-adj { background: #fff3e0; color: #ef6c00; }
        .tag-phrase { background: #e8f5e9; color: #2e7d32; }

        /* кнопка додавання слова */
        .btn-gradient {
            background: var(--brand-gradient); border: none; color: white;
            padding: 12px 25px; border-radius: 14px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 95, 109, 0.2);
        }

        /* фільтри категорій */
        .filter-pill {
            padding: 8px 20px; border-radius: 12px; background: white;
            border: 1px solid #eee; margin-right: 10px; cursor: pointer; transition: 0.3s; font-weight: 500;
        }
        .filter-pill.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }

        .example-box { background: #fdfdfd; border-left: 3px solid #eee; padding: 10px; font-size: 0.9rem; color: #636e72; font-style: italic; }
    </style>
</head>

<body>
    <div class="d-flex">
        <nav class="sidebar shadow">
            <div class="p-4 text-center">
                <img src="bg.png" alt="Logo" class="sidebar-logo">
                <span class="sidebar-brand-text">EsPass</span>
            </div>
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-th-large"></i> Panel</a></li>
                <li class="nav-item"><a class="nav-link" href="lectures.html"><i class="fas fa-book-open"></i> Lecciones</a></li>
                <li class="nav-item"><a class="nav-link active" href="vocabulary.html"><i class="fas fa-spell-check"></i> Vocabulario</a></li>
                <li class="nav-item"><a class="nav-link" href="progress.html"><i class="fas fa-trophy"></i> Logros</a></li>
                <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Ajustes</a></li>
            </ul>
        </nav>

        <div class="content-area">
            <header class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold m-0">Mi Vocabulario</h2>
                </div>
                
                <div class="d-flex align-items-center">
                    <button id="addWordBtn" class="btn btn-gradient me-4"><i class="fas fa-plus me-2"></i> Nueva palabra</button>
                    
                    <a href="#" class="header-action-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge"></span>
                    </a>
                    
                    <a href="login.html" class="header-action-btn me-3" title="Cerrar sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>

                    <div class="me-3 text-end">
                        <div class="fw-bold mb-0 js-user-name" style="font-size: 0.9rem;">Valeria S.</div>
                        <small class="text-muted js-user-level">Estudiante A2</small>
                    </div>
                    <img src="ava.jpg" class="rounded-4 shadow-sm" width="48" height="48">
                </div>
            </header>

            <div class="mb-5">
                <p class="text-muted">Словник для вивчення або повторення слів</p>
            </div>

            <div class="d-flex mb-5">
                <div class="filter-pill active" id="wordsCount">Todos (5)</div>
            </div>

            <div class="row g-4" id="wordsContainer"></div>

            <footer class="mt-5 text-center text-muted">
                <small>Copyright © EsPass 2026</small>
            </footer>
        </div>
    </div>



    <div class="modal fade" id="wordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border: none; border-radius: 24px;">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">Nueva palabra</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="wordForm">
                    <div class="modal-body px-4">
                        <input type="text" id="wordInput" class="form-control mb-3" placeholder="Palabra en español" required>
                        <input type="text" id="translationInput" class="form-control mb-3" placeholder="Переклад українською" required>
                        <select id="typeInput" class="form-select mb-3" required>
                            <option value="Verbo">Verbo</option>
                            <option value="Sustantivo">Sustantivo</option>
                            <option value="Adjetivo">Adjetivo</option>
                            <option value="Frase">Frase</option>
                        </select>
                        <input type="text" id="transcriptionInput" class="form-control mb-3" placeholder="Транскрипція /opcional/">
                        <textarea id="exampleInput" class="form-control" rows="3" placeholder="Приклад речення"></textarea>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-gradient">Додати</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
